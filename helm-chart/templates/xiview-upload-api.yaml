apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiview-upload-api
  labels:
    app: xiview-upload-api
spec:
  replicas: {{ .Values.xiviewUploadApi.replicaCount }}
  selector:
    matchLabels:
      app: xiview-upload-api
  template:
    metadata:
      labels:
        app: xiview-upload-api
    spec:
      {{- with .Values.xiviewUploadApi.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: application-db-config
          configMap:
            name: crosslinking-api-config
            items:
              - key: config.ini
                path: database.ini
        {{- if .Values.localDev }}
        - name: host-upload-main
          hostPath:
            path: {{ .Values.localDevPath }}/xiview-upload-api/main.py
            type: File
        - name: host-upload-temp
          hostPath:
            path: {{ .Values.localDevPath }}/upload_temp
            type: Directory
        - name: host-workspace
          hostPath:
            path: {{ .Values.localDevPath }}
            type: Directory
        {{- end }}
      {{- with .Values.xiviewUploadApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.xiviewUploadApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.xiviewUploadApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: xiview-upload-api
          image: "{{ if .Values.xiviewUploadApi.image.registry }}{{ .Values.xiviewUploadApi.image.registry }}/{{ end }}{{ if .Values.xiviewUploadApi.image.repository }}{{ .Values.xiviewUploadApi.image.repository }}/{{ end }}{{ .Values.xiviewUploadApi.image.name }}:{{ .Values.xiviewUploadApi.image.tag }}"
          imagePullPolicy: {{ .Values.xiviewUploadApi.image.pullPolicy }}
          resources:
            {{- toYaml .Values.xiviewUploadApi.resources | nindent 12 }}
          env:
            - name: DB_CONFIG
              value: "/home/appuser/database.ini"
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: application-db-config
              mountPath: /home/appuser/database.ini
              subPath: database.ini
              readOnly: true
            {{- if .Values.localDev }}
            - name: host-upload-main
              mountPath: /home/appuser/main.py
            - name: host-upload-temp
              mountPath: /home/appuser/mzId_upload_temp
            - name: host-workspace
              mountPath: /home/default/workspaces/misc/xiview-k8s
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: xiview-upload-api-service
spec:
  selector:
    app: xiview-upload-api
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090

  type: {{ .Values.xiviewUploadApi.service.type }}